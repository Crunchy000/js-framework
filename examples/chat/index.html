<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jsonx chat</title>

  <!-- A pretend WebSocket server (a real one would run elsewhere). The page itself has no script. -->
  <script src="echo-server.js?v=27"></script>
  <script type="module" src="../../jsonx.js?v=27"></script>

  <style>
    :root { --bg: #f4f4f5; --panel: #fff; --text: #18181b; --muted: #71717a; --line: #e4e4e7;
            --me: #4f46e5; --me-text: #fff; --bot: #f4f4f5; --warn: #b45309; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #09090b; --panel: #18181b; --text: #fafafa; --muted: #a1a1aa; --line: #27272a;
              --me: #6366f1; --bot: #27272a; --warn: #fbbf24; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .intro { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
    .intro a { color: inherit; }

    .chat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; height: min(70vh, 560px); }
    .head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
    .head strong { font-size: 15px; }
    .status::before { content: "Connecting…"; color: var(--muted); }
    .jx-ws-open .status::before { content: "● Online"; color: #16a34a; }
    .jx-ws-closed .status::before { content: "Reconnecting…"; color: var(--warn); }

    /* column-reverse keeps the newest message in view, with no script. */
    .log { flex: 1; overflow-y: auto; display: flex; flex-direction: column-reverse; padding: 12px 14px; }
    .log ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .log li { max-width: 80%; display: flex; flex-direction: column; }
    .log li.me { align-self: flex-end; align-items: flex-end; }
    .bubble { padding: 8px 12px; border-radius: 16px; background: var(--bot); overflow-wrap: anywhere; white-space: pre-wrap; }
    .me .bubble { background: var(--me); color: var(--me-text); border-bottom-right-radius: 4px; }
    .bot .bubble { border-bottom-left-radius: 4px; }
    .log time { font-size: 11px; color: var(--muted); margin: 2px 6px 0; }
    .typing { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
    .notice { color: var(--warn); font-size: 13px; margin: 0; padding: 0 14px 6px; }

    form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
    input { flex: 1; font: inherit; padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: inherit; }
    button { font: inherit; padding: 9px 16px; border: 0; border-radius: 999px; background: var(--me); color: var(--me-text); cursor: pointer; }
    .jx-ws-closed button { opacity: .5; }
  </style>
</head>
<body>
  <main>
    <h1>Chat with Echo</h1>
    <p class="intro">A WebSocket chat built with <a href="../../">jsonx</a> and no page script. Every message from the server is the whole view as JSON, and only what changed is drawn. Echo is a pretend server in the page. <a href="https://github.com/crunchy000/js-framework/blob/main/examples/chat/index.html">Source</a></p>

    <!-- The region: drawn from each message the socket sends. -->
    <div class="chat" jx-ws="/ws/echo">
      <template>
        <div class="head"><strong>Echo</strong> <span class="status" role="status"></span></div>

        <div class="log" aria-live="polite">
          <div>
            <ol>
              <li jx-each="messages" class="{{from}}">
                <span class="bubble">{{text}}</span>
                <time>{{who}} · {{time}}</time>
              </li>
            </ol>
            <jx-if test="typing"><p class="typing">Echo is typing…</p></jx-if>
          </div>
        </div>

        <jx-if test="notice"><p class="notice">{{notice}}</p></jx-if>

        <!-- Sends { "text": "..." } over the socket. -->
        <form jx-ws-send>
          <input name="text" value="{{draft}}" placeholder="Say something, or /help" aria-label="Message" autocomplete="off" autofocus>
          <button>Send</button>
        </form>
      </template>
    </div>
  </main>
</body>
</html>
