<!doctype html>
<html lang="en" class="wa-cloak">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home — Conduit GraphQL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/styles/webawesome.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/webawesome.loader.js"></script>
  <link rel="stylesheet" href="style.css?v=26">

  <!-- Pretend servers: the RealWorld REST API, and a GraphQL server in front of it.
       In real life they run on a server, and these two lines go away. -->
  <script src="../conduit/mock-api.js?v=26"></script>
  <script type="module" src="graphql-server.js?v=26"></script>
  <script type="module" src="../../jsonx.js?v=26"></script>
  <script>if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("wa-dark");</script>
</head>
<body>
  <template src="nav.jx"></template>
  <header class="banner">
    <h1>conduit</h1>
    <p>A place to share your knowledge. This copy talks GraphQL.</p>
  </header>

  <!-- The page asks for exactly what it shows. Variables come from the region's
       controls (the tabs, and the hidden tag and offset), like a form. -->
  <script type="text/graphql" id="query">
    query Home($scope: ArticleScope, $tag: String, $offset: Int) { ...View }
  </script>
  <script type="text/graphql" id="view">
    fragment View on Query {
      viewer { username }
      tag(name: $tag) { name }
      tags
      articles(scope: $scope, tag: $tag, offset: $offset, limit: 10) {
        scope offset
        pages { number offset current }
        nodes { ...Preview }
      }
    }
  </script>
  <!-- Every mutation answers with `query`, so it can ask for the same view again. -->
  <script type="text/graphql" id="favorite">
    mutation Favorite($slug: String!, $scope: ArticleScope, $tag: String, $offset: Int) {
      favoriteArticle(slug: $slug) { query { ...View } }
    }
  </script>
  <script type="text/graphql" id="unfavorite">
    mutation Unfavorite($slug: String!, $scope: ArticleScope, $tag: String, $offset: Int) {
      unfavoriteArticle(slug: $slug) { query { ...View } }
    }
  </script>

  <div class="layout" jx-query="#query, #view, #preview-fields"
       jx-vals='{"scope": ":scope", "tag": ":tag", "offset": ":offset"}' jx-push-url="scope tag offset">
    <p class="empty">Loading articles...</p>
    <template>
      <input type="hidden" name="tag" value="{{tag.name}}">
      <input type="hidden" name="offset" value="{{articles.offset}}">

      <main>
        <!-- The tabs are a radio group named "scope": changing it reloads the list,
             and value="{{articles.scope}}" shows the one the server used. -->
        <wa-radio-group class="tabs-group" name="scope" orientation="horizontal" value="{{articles.scope}}"
                        jx-query="#query, #view, #preview-fields" jx-vals='{"offset": 0}'>
          <jx-if test="viewer">
            <wa-radio appearance="button" value="FEED">Your feed</wa-radio>
          </jx-if>
          <wa-radio appearance="button" value="GLOBAL">Global feed</wa-radio>
          <jx-if test="tag">
            <wa-radio appearance="button" value="TAG"># {{tag.name}}</wa-radio>
          </jx-if>
        </wa-radio-group>
        <jx-if test="error">
          <wa-callout variant="warning">{{error}} <a href="login.html">Sign in</a></wa-callout>
        </jx-if>
        <template jx-use="#previews"></template>
      </main>

      <aside>
        <wa-card>
          <h2>Popular tags</h2>
          <div class="wa-cluster wa-gap-2xs">
            <jx-each items="tags">
              <a href="#" jx-query="#query, #view, #preview-fields"
                 jx-vals='{"tag": "{{.}}", "scope": "TAG", "offset": 0}'><wa-tag size="s" pill>{{.}}</wa-tag></a>
            </jx-each>
          </div>
        </wa-card>
      </aside>
    </template>
  </div>

  <template src="previews.jx"></template>
</body>
</html>
