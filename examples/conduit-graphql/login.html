<!doctype html>
<html lang="en" class="wa-cloak">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Conduit GraphQL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/styles/webawesome.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/webawesome.loader.js"></script>
  <link rel="stylesheet" href="style.css?v=16">

  <!-- Pretend servers: the RealWorld REST API, and a GraphQL server in front of it.
       In real life they run on a server, and these two lines go away. -->
  <script src="../conduit/mock-api.js?v=16"></script>
  <script type="module" src="graphql-server.js?v=16"></script>
  <script type="module" src="../../jsonx.js?v=16"></script>
  <script>if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("wa-dark");</script>
</head>
<body>
  <template src="nav.jx"></template>

  <script type="text/graphql" id="mutation">
    mutation Login($email: String, $password: String) { login(email: $email, password: $password) { user { username } } }
  </script>

  <main class="narrow">
    <h1>Sign in</h1>
    <p class="switch"><a href="register.html">Need an account?</a> Or try <code>demo@conduit.dev</code> / <code>password123</code>.</p>
    <div class="wa-stack" jx-region>
      <template>
        <jx-if test="error">
          <wa-callout variant="danger">{{error}}</wa-callout>
        </jx-if>
        <wa-input name="email" type="email" placeholder="Email" size="l" autofocus></wa-input>
        <wa-input name="password" type="password" placeholder="Password" size="l" password-toggle
                  jx-query="#mutation" jx-trigger="keydown[key=Enter]" jx-swap="none" jx-then="index.html"></wa-input>
        <div><wa-button variant="success" size="l" jx-query="#mutation" jx-swap="none" jx-then="index.html">Sign in</wa-button></div>
      </template>
    </div>
  </main>
</body>
</html>
