<!doctype html>
<html lang="en" class="wa-cloak">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conduit sign-in</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/styles/webawesome.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/webawesome.loader.js"></script>

  <!-- A pretend RealWorld server. Remove it to use a real one. -->
  <script src="mock-api.js?v=3"></script>
  <script type="module" src="../../jsonx.js?v=3"></script>

  <script>
    if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("wa-dark");
  </script>
  <style>
    body { margin: 0; min-height: 100vh; background: var(--wa-color-surface-lowered); }
    main { max-width: 480px; margin: 0 auto; padding: var(--wa-space-2xl) 16px; }
    header p { margin: 0; color: var(--wa-color-text-quiet); }
    .jx-loading { opacity: .6; transition: opacity .2s; }
  </style>
</head>
<body>
  <main class="wa-stack wa-gap-xl">
    <header class="wa-stack wa-gap-2xs">
      <h1 class="wa-heading-2xl">Sign in to Conduit</h1>
      <p>The sign-in from the <a href="https://github.com/realworld-apps/realworld">RealWorld</a> spec, with jsonx. Try <code>demo@conduit.dev</code> and <code>password123</code>, or a wrong password.</p>
    </header>

    <!-- The account region. It asks the API who you are (GET /api/user), but only
         when the script below says so: "manual" is an event nobody fires. -->
    <wa-card id="account" jx-get="/api/user" jx-trigger="manual">
      <template>
        <!-- Signed out: the form. Dotted names send { "user": { "email", "password" } }. -->
        <div jx-if="!user" class="wa-stack">
          <wa-callout jx-if="error" variant="danger">
            <wa-icon slot="icon" name="circle-exclamation"></wa-icon>
            <ul class="wa-stack wa-gap-3xs" style="margin: 0; padding-left: 1em;">
              <li jx-each="errors">{{text}}</li>
            </ul>
          </wa-callout>

          <wa-input name="user.email" type="email" label="Email" autofocus></wa-input>

          <wa-input name="user.password" type="password" label="Password" password-toggle
                    jx-post="/api/users/login" jx-trigger="keydown[key=Enter]"></wa-input>

          <wa-button variant="brand" jx-post="/api/users/login">Sign in</wa-button>
        </div>

        <!-- Signed in: the answer was { user: {...} }, so this part shows instead. -->
        <div jx-if="user" class="wa-stack">
          <wa-callout jx-if="error" variant="danger">{{error}}</wa-callout>
          <div class="wa-cluster">
            <wa-avatar label="{{user.username}}"></wa-avatar>
            <div class="wa-stack wa-gap-3xs">
              <strong>Signed in as {{user.username}}</strong>
              <span>{{user.bio}}</span>
            </div>
          </div>
          <div class="wa-cluster">
            <!-- Sends the saved token, so the server knows who's asking. -->
            <wa-button jx-get="/api/user">Ask the server who I am</wa-button>
            <wa-button id="sign-out" appearance="plain">Sign out</wa-button>
          </div>
        </div>
      </template>
    </wa-card>
  </main>

  <script type="module">
    var account = document.querySelector("#account");

    // Every request sends the saved token, the way the RealWorld spec asks.
    jsonx.headers = function () {
      var token = localStorage.getItem("jwtToken");
      return token ? { Authorization: "Token " + token } : {};
    };

    // Any answer with a user in it carries a fresh token: keep it.
    document.addEventListener("jx:afterRender", function (event) {
      var data = event.detail.data;
      if (data && data.user && data.user.token) localStorage.setItem("jwtToken", data.user.token);
    });

    // A token the server turns down is no use any more, so forget it.
    document.addEventListener("jx:error", function (event) {
      if (event.detail.error.status === 401) localStorage.removeItem("jwtToken");
    });

    // Signing out is only forgetting the token, so it's plain page code.
    account.addEventListener("click", function (event) {
      if (event.target.closest("#sign-out")) {
        localStorage.removeItem("jwtToken");
        jsonx.render(account, {});
      }
    });

    // On page load: if we have a token, ask who we are. Otherwise show the form.
    if (localStorage.getItem("jwtToken")) jsonx.request(account);
    else jsonx.render(account, {});
  </script>
</body>
</html>
