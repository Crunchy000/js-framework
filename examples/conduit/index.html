<!doctype html>
<html lang="en" class="wa-cloak">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home — Conduit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/styles/webawesome.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/webawesome.loader.js"></script>
  <link rel="stylesheet" href="style.css?v=34">

  <!-- Pretend servers: the RealWorld API, and the view API in front of it.
       In real life both run on a server, and these two lines go away. -->
  <script src="mock-api.js?v=34"></script>
  <script src="view-api.js?v=34"></script>
  <script type="module" src="../../jsonx.js?v=34"></script>
  <script>if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("wa-dark");</script>
</head>
<body>
  <template src="nav.jx"></template>
  <header class="banner">
    <h1>conduit</h1>
    <p>A place to share your knowledge.</p>
  </header>

  <!-- The whole home page is one region. GET /view/home answers with the tabs,
       one page of articles, the page buttons and the popular tags. -->
  <div class="layout" jx-get="/view/home?tab=:tab&tag=:tag&page=:page" jx-push-url>
    <p class="empty">Loading articles...</p>
    <template>
      <!-- Sent with every request, so the server knows which tab and page you're on. -->
      <input type="hidden" name="tab" value="{{tab}}">
      <input type="hidden" name="tag" value="{{tag}}">
      <input type="hidden" name="page" value="{{page}}">

      <main>
        <div class="tabs">
          <jx-each items="tabs">
            <wa-button appearance="plain" class:active="{{active}}"
                       jx-get="/view/home" jx-vals='{"tab": "{{name}}", "tag": "{{tag}}", "page": 1}'>{{label}}</wa-button>
          </jx-each>
        </div>
        <jx-if test="error">
          <wa-callout variant="warning">{{error}} <a href="login.html">Sign in</a></wa-callout>
        </jx-if>
        <template jx-use="#previews"></template>
        <jx-if test="pages">
          <div class="pages wa-cluster wa-gap-2xs">
            <jx-each items="pages">
              <wa-button size="s" appearance="outlined" class:current="{{current}}"
                         jx-get="/view/home" jx-vals='{"page": {{number}}}'>{{number}}</wa-button>
            </jx-each>
          </div>
        </jx-if>
      </main>

      <aside>
        <wa-card>
          <h2>Popular tags</h2>
          <div class="wa-cluster wa-gap-2xs">
            <jx-each items="tags">
              <a href="#" jx-get="/view/home" jx-vals='{"tag": "{{.}}", "page": 1}'><wa-tag size="s" pill>{{.}}</wa-tag></a>
            </jx-each>
          </div>
        </wa-card>
      </aside>
    </template>
  </div>

  <template src="previews.jx"></template>
</body>
</html>
