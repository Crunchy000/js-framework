<!doctype html>
<html lang="en" class="wa-cloak">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings — Conduit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/styles/webawesome.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/webawesome.loader.js"></script>
  <link rel="stylesheet" href="style.css?v=5">

  <!-- Pretend servers: the RealWorld API, and the view API in front of it.
       In real life both run on a server, and these two lines go away. -->
  <script src="mock-api.js?v=5"></script>
  <script src="view-api.js?v=5"></script>

  <script src="nav.js?v=5"></script>
  <script type="module" src="../../jsonx.js?v=5"></script>
  <script>if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("wa-dark");</script>
</head>
<body>
  <conduit-nav></conduit-nav>

  <main class="narrow">
    <h1>Your settings</h1>
    <div class="wa-stack" style="margin-top: var(--wa-space-l)" jx-get="/view/settings">
      <template>
        <p jx-if="!signedIn" class="empty"><a href="login.html">Sign in</a> to see this page.</p>
        <div jx-if="signedIn" class="wa-stack">
          <wa-callout jx-if="error" variant="danger">
          <ul class="wa-stack wa-gap-3xs" style="margin: 0; padding-left: 1em;"><li jx-each="errors">{{text}}</li></ul>
        </wa-callout>
          <wa-input name="image" placeholder="URL of profile picture" value="{{user.image}}"></wa-input>
          <wa-input name="username" placeholder="Username" size="l" value="{{user.username}}"></wa-input>
          <wa-textarea name="bio" placeholder="Short bio about you" rows="5" value="{{user.bio}}"></wa-textarea>
          <wa-input name="email" type="email" placeholder="Email" size="l" value="{{user.email}}"></wa-input>
          <wa-input name="password" type="password" placeholder="New password (leave empty to keep it)" size="l"></wa-input>
          <div><wa-button variant="success" size="l" jx-put="/view/settings" jx-swap="none"
                          jx-then="profile.html?username=:user.username">Update settings</wa-button></div>
          <wa-divider></wa-divider>
          <div class="wa-split">
            <wa-button variant="danger" appearance="outlined" jx-post="/view/logout" jx-swap="none" jx-then="index.html">Or click here to sign out.</wa-button>
            <wa-button appearance="plain" size="s" jx-post="/view/reset" jx-swap="none" jx-then="index.html">Reset demo data</wa-button>
          </div>
        </div>
      </template>
    </div>
  </main>
</body>
</html>
