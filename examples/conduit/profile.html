<!doctype html>
<html lang="en" class="wa-cloak">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile — Conduit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/styles/webawesome.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/webawesome.loader.js"></script>
  <link rel="stylesheet" href="style.css?v=7">

  <!-- Pretend servers: the RealWorld API, and the view API in front of it.
       In real life both run on a server, and these two lines go away. -->
  <script src="mock-api.js?v=7"></script>
  <script src="view-api.js?v=7"></script>

  <script src="nav.js?v=7"></script>
  <script type="module" src="../../jsonx.js?v=7"></script>
  <script>if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("wa-dark");</script>
</head>
<body>
  <conduit-nav></conduit-nav>

  <!-- profile.html?username=ada. One region: the profile, its tabs and its articles. -->
  <div jx-get="/view/profile/:username">
    <template>
      <input type="hidden" name="tab" value="{{tab}}">
      <input type="hidden" name="page" value="{{page}}">

      <div id="profile" class="profile-banner">
        <wa-avatar initials="{{profile.initial}}" image="{{profile.image}}" label="{{profile.username}}"></wa-avatar>
        <h1>{{profile.username}}</h1>
        <p>{{profile.bio}}</p>
        <wa-button jx-if="profile.mine" size="s" appearance="outlined" href="settings.html"><wa-icon slot="start" name="gear"></wa-icon>Edit profile settings</wa-button>
        <wa-button jx-if="!profile.mine" size="s" appearance="{{profile.followAppearance}}" jx-post="/view/profile/{{profile.username}}/follow">
          <wa-icon slot="start" name="user-plus"></wa-icon>{{profile.followLabel}}</wa-button>
      </div>

      <main class="narrow" style="padding-top: var(--wa-space-l)">
        <wa-callout jx-if="error" variant="warning">{{error}} <a href="login.html">Sign in</a></wa-callout>
        <div class="tabs">
          <wa-button jx-each="tabs" appearance="plain" class:active="{{active}}"
                     jx-get="/view/profile/{{profile.username}}" jx-vals='{"tab": "{{name}}", "page": 1}'>{{label}}</wa-button>
        </div>
        <template jx-use="#previews"></template>
        <div class="pages wa-cluster wa-gap-2xs" jx-if="pages">
          <wa-button jx-each="pages" size="s" appearance="outlined" class:current="{{current}}"
                     jx-get="/view/profile/{{profile.username}}" jx-vals='{"page": {{number}}}'>{{number}}</wa-button>
        </div>
      </main>
    </template>
  </div>

  <!-- A list of article previews, used by the page's template. -->
  <template id="previews">
    <p class="empty" jx-if="!articles">No articles are here... yet.</p>
    <article class="preview" jx-each="articles">
      <div class="wa-split">
        <template jx-use="#author"></template>
        <wa-button size="s" variant="success" appearance="{{favoriteAppearance}}" jx-post="{{favoriteUrl}}">
          <wa-icon slot="start" name="heart"></wa-icon>{{favoritesCount}}
        </wa-button>
      </div>
      <a class="title" href="{{url}}">
        <h2>{{title}}</h2>
        <p>{{description}}</p>
      </a>
      <div class="wa-split">
        <small>Read more...</small>
        <div class="wa-cluster wa-gap-2xs"><wa-tag size="s" appearance="outlined" jx-each="tagList">{{.}}</wa-tag></div>
      </div>
    </article>
  </template>

  <template id="author">
    <a class="author" href="{{author.url}}">
      <wa-avatar initials="{{author.initial}}" image="{{author.image}}" label="{{author.username}}"></wa-avatar>
      <span><strong>{{author.username}}</strong><br><small>{{date}}</small></span>
    </a>
  </template>
</body>
</html>
