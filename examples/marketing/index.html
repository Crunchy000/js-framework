<!doctype html>
<html lang="en" class="wa-cloak">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beacon — status pages for small teams</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/styles/webawesome.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/webawesome.loader.js"></script>
  <link rel="stylesheet" href="style.css?v=38">

  <!-- Pretend servers: a Contentful-style CMS, and the view API in front of it.
       In real life both are on a server, and these two lines go away. -->
  <script src="cms-api.js?v=38"></script>
  <script src="view-api.js?v=38"></script>
  <script type="module" src="../../jsonx.js?v=38"></script>
  <script>if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("wa-dark");</script>
</head>
<body>
  <!-- The whole site is this one page. ?page=pricing, ?page=blog and ?post=... pick
       what to show; the CMS decides which sections it has, and in what order.
       This file only says how each kind of section looks. -->
  <div jx:get="/view/page?slug=:page&amp;post=:post">
    <div class="loading"><wa-spinner></wa-spinner></div>
    <template>
      <header class="site-nav">
        <nav class="wa-split container">
          <a class="brand" href="index.html"><wa-icon name="tower-broadcast"></wa-icon> {{nav.brand}}</a>
          <div class="wa-cluster wa-gap-l">
            <each items="nav.links">
              <a href="{{url}}">{{label}}</a>
            </each>
            <wa-button size="s" variant="brand" href="{{nav.cta.url}}">{{nav.cta.label}}</wa-button>
          </div>
        </nav>
      </header>

      <main>
        <each items="sections">
          <each items="hero">
            <section class="hero">
              <div class="container wa-stack wa-gap-l wa-align-items-center">
                <if test="badge">
                  <wa-badge pill appearance="outlined">{{badge}}</wa-badge>
                </if>
                <h1>{{heading}}</h1>
                <p class="lead">{{subheading}}</p>
                <if test="primary">
                  <div class="wa-cluster wa-justify-content-center">
                    <wa-button variant="brand" size="l" href="{{primary.url}}">{{primary.label}}</wa-button>
                    <if test="secondary">
                      <wa-button size="l" appearance="outlined" href="{{secondary.url}}">{{secondary.label}}</wa-button>
                    </if>
                  </div>
                </if>
              </div>
            </section>
          </each>

          <each items="logos">
            <section class="logos">
              <div class="container wa-stack wa-align-items-center">
                <p class="eyebrow">{{heading}}</p>
                <div class="wa-cluster wa-gap-2xl wa-justify-content-center"><each items="names"><span>{{.}}</span></each></div>
              </div>
            </section>
          </each>

          <each items="features">
            <section class="features" id="{{anchor}}">
              <div class="container">
                <h2>{{heading}}</h2>
                <p class="lead">{{intro}}</p>
                <div class="wa-grid" style="--min-column-size: 240px">
                  <each items="items">
                    <wa-card>
                      <wa-icon name="{{icon}}" class="feature-icon"></wa-icon>
                      <h3>{{title}}</h3>
                      <p>{{body}}</p>
                    </wa-card>
                  </each>
                </div>
              </div>
            </section>
          </each>

          <each items="testimonial">
            <section class="testimonial">
              <figure class="container">
                <blockquote>“{{quote}}”</blockquote>
                <figcaption class="wa-cluster wa-justify-content-center">
                  <wa-avatar initials="{{initials}}" label="{{name}}"></wa-avatar>
                  <span><strong>{{name}}</strong><br>{{role}}</span>
                </figcaption>
              </figure>
            </section>
          </each>

          <each items="pricing">
            <section class="pricing">
              <div class="container">
                <h2>{{heading}}</h2>
                <div class="wa-grid" style="--min-column-size: 240px">
                  <each items="plans">
                    <wa-card class:highlighted="{{highlighted}}">
                      <if test="highlighted">
                        <wa-badge slot="header" variant="brand">Most popular</wa-badge>
                      </if>
                      <h3>{{name}}</h3>
                      <p class="price"><strong>{{price}}</strong> {{period}}</p>
                      <p>{{description}}</p>
                      <ul class="checks"><each items="features"><li><wa-icon name="check"></wa-icon> {{.}}</li></each></ul>
                      <wa-button slot="footer" variant="{{buttonVariant}}" appearance="{{buttonAppearance}}" href="{{cta.url}}">{{cta.label}}</wa-button>
                    </wa-card>
                  </each>
                </div>
              </div>
            </section>
          </each>

          <each items="faq">
            <section class="faq">
              <div class="container narrow">
                <h2>{{heading}}</h2>
                <each items="questions">
                  <wa-details summary="{{question}}">
                    <template jx:use="#rich-text"></template>
                  </wa-details>
                </each>
              </div>
            </section>
          </each>

          <each items="posts">
            <section class="posts">
              <div class="container narrow wa-stack">
                <h2>{{heading}}</h2>
                <each items="items">
                  <a class="post" href="{{url}}">
                    <small>{{date}} · {{author}}</small>
                    <h3>{{title}}</h3>
                    <p>{{excerpt}}</p>
                    <div class="wa-cluster wa-gap-2xs"><each items="tags"><wa-tag size="s">{{.}}</wa-tag></each></div>
                  </a>
                </each>
              </div>
            </section>
          </each>

          <each items="article">
            <article class="article">
              <div class="container narrow">
                <p><a href="index.html?page=blog">← All posts</a></p>
                <h1>{{title}}</h1>
                <p class="byline">{{date}} · {{author}}</p>
                <template jx:use="#rich-text"></template>
                <div class="wa-cluster wa-gap-2xs"><each items="tags"><wa-tag size="s">{{.}}</wa-tag></each></div>
              </div>
            </article>
          </each>

          <each items="signup">
            <section class="signup" id="signup">
              <div class="container narrow wa-stack wa-align-items-center">
                <h2>{{heading}}</h2>
                <p>{{body}}</p>
                <!-- The form is its own small region: posting it only redraws the form. -->
                <div class="signup-form" jx:region>
                  <template>
                    <if test="!done">
                      <div class="wa-cluster wa-gap-xs wa-align-items-end">
                        <wa-input name="email" type="email" placeholder="you@company.com" label="Email" hint="{{fieldErrors.email}}"
                                  jx:post="/view/signup" jx:trigger="keydown[key=Enter]"></wa-input>
                        <wa-button variant="brand" jx:post="/view/signup">Subscribe</wa-button>
                      </div>
                    </if>
                    <else>
                      <wa-callout variant="success"><wa-icon slot="icon" name="circle-check"></wa-icon>{{message}}</wa-callout>
                    </else>
                  </template>
                </div>
              </div>
            </section>
          </each>

          <each items="cta">
            <section class="cta">
              <div class="container wa-stack wa-align-items-center">
                <h2>{{heading}}</h2>
                <p class="lead">{{body}}</p>
                <wa-button size="l" href="{{button.url}}">{{button.label}}</wa-button>
              </div>
            </section>
          </each>
        </each>
      </main>

      <footer class="site-footer">
        <div class="container wa-split">
          <span><wa-icon name="tower-broadcast"></wa-icon> {{nav.brand}}</span>
          <span>A made-up product, built with jsonx and a Contentful-style API.</span>
        </div>
      </footer>
    </template>
  </div>

  <!-- Rich text from the CMS, as blocks: headings, paragraphs and lists.
       Each paragraph is a list of parts, which can be bold, italic or a link. -->
  <template id="rich-text">
    <each items="blocks">
      <div class="rich">
        <each items="h2">
          <h2>{{text}}</h2>
        </each>
        <each items="p">
          <p><template jx:use="#parts"></template></p>
        </each>
        <each items="ul">
          <ul><each items="items"><li><template jx:use="#parts"></template></li></each></ul>
        </each>
      </div>
    </each>
  </template>
  <template id="parts"><each items="parts"><span class:bold="{{bold}}" class:italic="{{italic}}"><if test="href"><a href="{{href}}">{{text}}</a></if><else><span>{{text}}</span></else></span></each></template>
</body>
</html>
