<!doctype html>
<html lang="en" class="wa-cloak">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jsonx todos</title>

  <!-- Web Awesome: theme, utilities and the component autoloader -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/styles/webawesome.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/webawesome.loader.js"></script>

  <!-- jsonx and its one dependency, EJS -->
  <script src="../../vendor/ejs.min.js"></script>
  <script src="mock-api.js"></script>
  <script src="../../jsonx.js"></script>

  <!-- Follow the visitor's light/dark setting -->
  <script>
    if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("wa-dark");
  </script>

  <style>
    body { margin: 0; min-height: 100vh; background: var(--wa-color-surface-lowered); }
    main { max-width: 640px; margin: 0 auto; padding: var(--wa-space-2xl) 16px; }
    header p { margin: 0; color: var(--wa-color-text-quiet); }
    .add wa-input { flex: 1 1 200px; }

    .todos { list-style: none; margin: 0; padding: 0; }
    .todos li {
      display: flex; align-items: center; gap: var(--wa-space-s);
      padding: var(--wa-space-xs) 0;
      border-bottom: var(--wa-border-width-s) solid var(--wa-color-surface-border);
    }
    .todos li:last-child { border-bottom: 0; }
    .todos li wa-checkbox { flex: 1; }
    .todos li.done wa-checkbox::part(label) { text-decoration: line-through; color: var(--wa-color-text-quiet); }
    .todos li.empty { color: var(--wa-color-text-quiet); justify-content: center; padding: var(--wa-space-l) 0; }

    /* jsonx adds .jx-loading to whatever made the request, while it runs */
    .jx-loading { opacity: .6; transition: opacity .2s; }
    footer { text-align: center; color: var(--wa-color-text-quiet); font-size: var(--wa-font-size-s); }
  </style>
</head>
<body>
  <main class="wa-stack wa-gap-l">
    <header class="wa-stack wa-gap-2xs">
      <h1 class="wa-heading-2xl">Todos</h1>
      <p>Built with <a href="../../">jsonx</a> and <a href="https://webawesome.com">Web Awesome</a>. The server sends the whole view as JSON; one EJS template draws it.</p>
    </header>

    <!-- This is the whole app. It's a "region": it has a template, so it loads
         itself when the page opens, and every button inside it re-renders it. -->
    <wa-card id="app" jx-get="api/todos" jx-template="#todo-app">
      <wa-skeleton effect="sheen"></wa-skeleton>
    </wa-card>

    <footer>Your todos are saved in this browser only.</footer>
  </main>

  <!--
    The one template. `data` is the view the server sent:
      { filter, todos: [{ id, title, done }], stats: { total, done, open, percent }, error }

    Every request from inside the region automatically sends the region's named
    controls: here that's the new todo's `title` and the hidden `filter`. So the
    buttons only need to say which URL to call.
  -->
  <script type="text/ejs" id="todo-app">
    <div class="wa-stack wa-gap-m">
      <input type="hidden" name="filter" value="<%= data.filter %>">

      <!-- Add: click the button, or press Enter in the input. -->
      <div class="add wa-cluster wa-gap-s">
        <wa-input name="title" placeholder="What needs doing?" aria-label="New todo" autocomplete="off"
                  autofocus jx-post="api/todos" jx-trigger="keydown[key=Enter]"></wa-input>
        <wa-button variant="brand" jx-post="api/todos">
          <wa-icon slot="start" name="plus"></wa-icon>
          Add
        </wa-button>
      </div>

      <% if (data.error) { %>
        <wa-callout variant="danger" size="s">
          <wa-icon slot="icon" name="circle-exclamation"></wa-icon>
          <%= data.error %>
        </wa-callout>
      <% } %>

      <!-- Filters. jx-vals overrides the hidden filter for this one request. -->
      <div class="wa-split">
        <wa-button-group label="Filter">
          <% ["all", "active", "done"].forEach(function (filter) { %>
            <wa-button size="s"
                       variant="<%= filter === data.filter ? 'brand' : 'neutral' %>"
                       appearance="<%= filter === data.filter ? 'accent' : 'outlined' %>"
                       jx-get="api/todos" jx-vals='{"filter": "<%= filter %>"}'>
              <%= filter[0].toUpperCase() + filter.slice(1) %>
            </wa-button>
          <% }) %>
        </wa-button-group>

        <wa-button size="s" appearance="plain" jx-delete="api/todos/completed">Clear completed</wa-button>
      </div>

      <ul class="todos">
        <% if (data.todos.length === 0) { %>
          <li class="empty">Nothing here yet</li>
        <% } %>
        <% data.todos.forEach(function (todo) { %>
          <li class="<%= todo.done ? 'done' : '' %>">
            <!-- A form control, so its default trigger is "change" -->
            <wa-checkbox <%= todo.done ? 'checked' : '' %> jx-post="api/todos/<%= todo.id %>/toggle"><%= todo.title %></wa-checkbox>
            <wa-button size="s" appearance="plain" variant="danger" jx-delete="api/todos/<%= todo.id %>">
              <wa-icon name="trash" label="Delete <%= todo.title %>"></wa-icon>
            </wa-button>
          </li>
        <% }) %>
      </ul>

      <wa-divider></wa-divider>

      <div class="wa-stack wa-gap-xs">
        <div class="wa-split">
          <span><strong><%= data.stats.done %></strong> of <%= data.stats.total %> done</span>
          <span class="wa-cluster wa-gap-2xs">
            <wa-badge variant="neutral"><%= data.stats.open %> open</wa-badge>
            <wa-badge variant="success"><%= data.stats.done %> done</wa-badge>
          </span>
        </div>
        <wa-progress-bar value="<%= data.stats.percent %>" label="Progress"></wa-progress-bar>
      </div>
    </div>
  </script>
</body>
</html>
