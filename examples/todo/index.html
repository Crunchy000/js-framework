<!doctype html>
<html lang="en" class="wa-cloak">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jsonx todos</title>

  <!-- Web Awesome: theme, utilities and the component autoloader -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/styles/webawesome.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/webawesome.loader.js"></script>

  <!-- A pretend JSON server (remove it when you have a real one), then jsonx -->
  <script src="mock-api.js?v=7"></script>
  <script type="module" src="../../jsonx.js?v=7"></script>

  <!-- Follow the visitor's light/dark setting -->
  <script>
    if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("wa-dark");
  </script>

  <style>
    body { margin: 0; min-height: 100vh; background: var(--wa-color-surface-lowered); }
    main { max-width: 640px; margin: 0 auto; padding: var(--wa-space-2xl) 16px; }
    header p { margin: 0; color: var(--wa-color-text-quiet); }
    .add wa-input { flex: 1 1 200px; }

    .todos { list-style: none; margin: 0; padding: 0; }
    .todos li {
      display: flex; align-items: center; gap: var(--wa-space-s);
      padding: var(--wa-space-xs) 0;
      border-bottom: var(--wa-border-width-s) solid var(--wa-color-surface-border);
    }
    .todos li:last-child { border-bottom: 0; }
    .todos li wa-checkbox { flex: 1; }
    .todos li.done wa-checkbox::part(label) { text-decoration: line-through; color: var(--wa-color-text-quiet); }
    .todos li.empty { color: var(--wa-color-text-quiet); justify-content: center; padding: var(--wa-space-l) 0; }

    /* jsonx adds .jx-loading to whatever made the request, while it runs */
    .jx-loading { opacity: .6; transition: opacity .2s; }
    footer { text-align: center; color: var(--wa-color-text-quiet); font-size: var(--wa-font-size-s); }
  </style>
</head>
<body>
  <main class="wa-stack wa-gap-l">
    <header class="wa-stack wa-gap-2xs">
      <h1 class="wa-heading-2xl">Todos</h1>
      <p>Built with <a href="../../">jsonx</a> and <a href="https://webawesome.com">Web Awesome</a>. The server sends the whole view as JSON, and one template draws it.</p>
    </header>

    <!--
      This card is the whole app. It's a "region": it has a <template> inside, so it
      loads its view when the page opens (jx-get), and every button inside it calls
      the API and redraws it. The view looks like:

        { filter, filters: [{ name, label, variant, appearance }],
          todos: [{ id, title, done }], stats: { total, done, open, percent },
          draft, error }

      Template rules: {{name}} prints a value, jx-each repeats an element,
      jx-if shows or hides one, and class:done="{{done}}" toggles a class.
    -->
    <wa-card id="app" jx-get="api/todos">
      <wa-skeleton effect="sheen"></wa-skeleton>

      <template>
        <div class="wa-stack wa-gap-m">
          <!-- Named controls are sent with every request from the region -->
          <input type="hidden" name="filter" value="{{filter}}">

          <!-- Add: click the button, or press Enter in the input -->
          <div class="add wa-cluster wa-gap-s">
            <wa-input name="title" value="{{draft}}" placeholder="What needs doing?" aria-label="New todo"
                      autocomplete="off" autofocus jx-post="api/todos" jx-trigger="keydown[key=Enter]"></wa-input>
            <wa-button variant="brand" jx-post="api/todos">
              <wa-icon slot="start" name="plus"></wa-icon>
              Add
            </wa-button>
          </div>

          <wa-callout variant="danger" size="s" jx-if="error">
            <wa-icon slot="icon" name="circle-exclamation"></wa-icon>
            {{error}}
          </wa-callout>

          <div class="wa-split">
            <wa-button-group label="Filter">
              <!-- jx-vals overrides the hidden filter for this one request -->
              <wa-button jx-each="filters" size="s" variant="{{variant}}" appearance="{{appearance}}"
                         jx-get="api/todos" jx-vals='{"filter": "{{name}}"}'>{{label}}</wa-button>
            </wa-button-group>

            <wa-button size="s" appearance="plain" jx-delete="api/todos/completed">Clear completed</wa-button>
          </div>

          <ul class="todos">
            <li jx-each="todos" class:done="{{done}}">
              <!-- A form control, so its default trigger is "change" -->
              <wa-checkbox checked="{{done}}" jx-post="api/todos/{{id}}/toggle">{{title}}</wa-checkbox>
              <wa-button size="s" appearance="plain" variant="danger" jx-delete="api/todos/{{id}}">
                <wa-icon name="trash" label="Delete {{title}}"></wa-icon>
              </wa-button>
            </li>
            <li class="empty" jx-if="!todos">Nothing here yet</li>
          </ul>

          <wa-divider></wa-divider>

          <div class="wa-stack wa-gap-xs">
            <div class="wa-split">
              <span><strong>{{stats.done}}</strong> of {{stats.total}} done</span>
              <span class="wa-cluster wa-gap-2xs">
                <wa-badge variant="neutral">{{stats.open}} open</wa-badge>
                <wa-badge variant="success">{{stats.done}} done</wa-badge>
              </span>
            </div>
            <wa-progress-bar value="{{stats.percent}}" label="Progress"></wa-progress-bar>
          </div>
        </div>
      </template>
    </wa-card>

    <footer>Your todos are saved in this browser only.</footer>
  </main>
</body>
</html>
