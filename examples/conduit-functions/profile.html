<!doctype html>
<html lang="en" class="wa-cloak">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile — Conduit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/styles/webawesome.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/webawesome.loader.js"></script>
  <link rel="stylesheet" href="../conduit/style.css?v=38">

  <!-- A pretend RealWorld API (the same one the other Conduits use) -->
  <script src="../conduit/mock-api.js?v=38"></script>
  <!-- The views: plain functions that pages call with fn:name -->
  <script src="views.js?v=38"></script>
  <script type="module" src="../../jsonx.js?v=38"></script>
  <script>if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("wa-dark");</script>
</head>
<body>
  <template src="nav.jx"></template>

  <!-- profile.html?username=ada. One region: the profile, its tabs and its articles. -->
  <div jx:get="fn:profile?username=:username&tab=:tab&page=:page" jx:push-url="tab page">
    <template>
      <input type="hidden" name="tab" value="{{tab}}">
      <input type="hidden" name="page" value="{{page}}">

      <div id="profile" class="profile-banner">
        <wa-avatar initials="{{profile.initial}}" image="{{profile.image}}" label="{{profile.username}}"></wa-avatar>
        <h1>{{profile.username}}</h1>
        <p>{{profile.bio}}</p>
        <if test="profile.mine">
          <wa-button size="s" appearance="outlined" href="settings.html"><wa-icon slot="start" name="gear"></wa-icon>Edit profile settings</wa-button>
        </if>
        <else>
          <wa-button size="s" appearance="{{profile.followAppearance}}" jx:post="fn:followProfile?username={{profile.username}}">
            <wa-icon slot="start" name="user-plus"></wa-icon>{{profile.followLabel}}</wa-button>
        </else>
      </div>

      <main class="narrow" style="padding-top: var(--wa-space-l)">
        <if test="error">
          <wa-callout variant="warning">{{error}} <a href="login.html">Sign in</a></wa-callout>
        </if>
        <div class="tabs">
          <each items="tabs">
            <wa-button appearance="plain" class:active="{{active}}"
                       jx:get="fn:profile?username={{profile.username}}" jx:vals='{"tab": "{{name}}", "page": 1}'>{{label}}</wa-button>
          </each>
        </div>
        <template jx:use="#previews"></template>
        <if test="pages">
          <div class="pages wa-cluster wa-gap-2xs">
            <each items="pages">
              <wa-button size="s" appearance="outlined" class:current="{{current}}"
                         jx:get="fn:profile?username={{profile.username}}" jx:vals='{"page": {{number}}}'>{{number}}</wa-button>
            </each>
          </div>
        </if>
      </main>
    </template>
  </div>

  <template src="../conduit/previews.jx"></template>
</body>
</html>
