<!doctype html>
<html lang="en" class="wa-cloak">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Article — Conduit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/styles/webawesome.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/webawesome.loader.js"></script>
  <link rel="stylesheet" href="../conduit/style.css?v=33">

  <!-- A pretend RealWorld API (the same one the other Conduits use) -->
  <script src="../conduit/mock-api.js?v=33"></script>
  <!-- The views: plain functions that pages call with fn:name -->
  <script src="views.js?v=33"></script>
  <script type="module" src="../../jsonx.js?v=33"></script>
  <script>if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("wa-dark");</script>
</head>
<body>
  <template src="nav.jx"></template>

  <!-- article.html?slug=hello: jsonx fills :slug from the address.
       The view has the article and its comments; every button answers with it again. -->
  <div id="article" jx-get="fn:article?slug=:slug">
    <template>
      <header class="banner dark">
        <h1>{{article.title}}</h1>
        <template jx-use="#meta"></template>
      </header>

      <div class="article-body">
        <!-- The body is HTML, cleaned before it's drawn. -->
        <div class="rich-text" jx-html="{{article.body}}"></div>
        <div class="wa-cluster wa-gap-2xs"><jx-each items="article.tagList"><wa-tag size="s" appearance="outlined">{{.}}</wa-tag></jx-each></div>
        <hr>
        <template jx-use="#meta"></template>
      </div>

      <section id="comments" class="comments wa-stack">
        <jx-if test="error">
          <wa-callout variant="danger">{{error}}</wa-callout>
        </jx-if>
        <jx-if test="signedIn">
          <div class="wa-stack wa-gap-s">
            <wa-textarea name="comment" placeholder="Write a comment..." rows="3" value="{{draft}}"></wa-textarea>
            <div><wa-button variant="success" jx-post="fn:addComment?slug={{article.slug}}">Post comment</wa-button></div>
          </div>
        </jx-if>
        <jx-else>
          <p><a href="login.html">Sign in</a> or <a href="register.html">sign up</a> to add comments on this article.</p>
        </jx-else>

        <jx-each items="comments">
          <wa-card>
            <p>{{body}}</p>
            <div slot="footer" class="wa-split">
              <template jx-use="#author"></template>
              <jx-if test="mine">
                <wa-button size="s" appearance="plain" variant="danger" label="Delete comment"
                           jx-post="fn:deleteComment?slug={{article.slug}}&id={{id}}"><wa-icon name="trash"></wa-icon></wa-button>
              </jx-if>
            </div>
          </wa-card>
        </jx-each>
      </section>
    </template>
  </div>

  <!-- Who wrote it, and the buttons. The view already says what each one is labelled. -->
  <template id="meta">
    <div class="meta wa-cluster">
      <a class="author" href="{{article.author.url}}">
        <wa-avatar initials="{{article.author.initial}}" image="{{article.author.image}}" label="{{article.author.username}}"></wa-avatar>
        <span><strong>{{article.author.username}}</strong><br><small>{{article.date}}</small></span>
      </a>
      <jx-if test="article.mine">
        <div class="wa-cluster wa-gap-xs">
          <wa-button size="s" appearance="outlined" href="{{article.editUrl}}"><wa-icon slot="start" name="pen"></wa-icon>Edit article</wa-button>
          <wa-button size="s" variant="danger" appearance="outlined" jx-post="fn:deleteArticle?slug={{article.slug}}"
                     jx-swap="none" jx-then="index.html"><wa-icon slot="start" name="trash"></wa-icon>Delete article</wa-button>
        </div>
      </jx-if>
      <jx-else>
        <div class="wa-cluster wa-gap-xs">
          <wa-button size="s" appearance="{{article.author.followAppearance}}" jx-post="fn:followAuthor?slug={{article.slug}}">
            <wa-icon slot="start" name="user-plus"></wa-icon>{{article.author.followLabel}}</wa-button>
          <wa-button size="s" variant="success" appearance="{{article.favoriteAppearance}}" jx-post="fn:favoriteArticle?slug={{article.slug}}">
            <wa-icon slot="start" name="heart"></wa-icon>{{article.favoriteLabel}}</wa-button>
        </div>
      </jx-else>
    </div>
  </template>

  <template id="author">
    <a class="author" href="{{author.url}}">
      <wa-avatar initials="{{author.initial}}" image="{{author.image}}" label="{{author.username}}" style="--size: 1.5rem"></wa-avatar>
      <strong>{{author.username}}</strong> <small>{{date}}</small>
    </a>
  </template>
</body>
</html>
